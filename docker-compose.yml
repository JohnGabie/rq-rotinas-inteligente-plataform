version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rotina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rotina_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotina_password}
      POSTGRES_DB: ${POSTGRES_DB:-rotina_inteligente_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rotina_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotina_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rotina_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rotina_user}:${POSTGRES_PASSWORD:-rotina_password}@postgres:5432/${POSTGRES_DB:-rotina_inteligente_db}
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      TUYA_API_KEY: ${TUYA_API_KEY:-}
      TUYA_API_SECRET: ${TUYA_API_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rotina_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotina_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - rotina_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rotina_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rotina.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - rotina_network

volumes:
  postgres_data:

networks:
  rotina_network:
    driver: bridge
