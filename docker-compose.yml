services:
  postgres:
    image: postgres:15-alpine
    container_name: rotina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rotina_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotina_password}
      POSTGRES_DB: ${POSTGRES_DB:-rotina_inteligente_db}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rotina_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rotina_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: rotina_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rotina_user}:${POSTGRES_PASSWORD:-rotina_password}@localhost:5432/${POSTGRES_DB:-rotina_inteligente_db}
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      TUYA_API_KEY: ${TUYA_API_KEY:-}
      TUYA_API_SECRET: ${TUYA_API_SECRET:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotina_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "backend:host-gateway"
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  postgres_data:

networks:
  rotina_network:
    driver: bridge
